name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"        # daily ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the heatmap runs on a schedule, and it is stdlib-only. Pillow and
      # numpy are needed just for the portrait, which is regenerated by hand.
      - name: Refresh contribution data
        working-directory: scripts
        run: python fetch_contributions.py

      - name: Render heatmap
        working-directory: scripts
        run: python render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json heatmap-dark.svg heatmap-light.svg"
