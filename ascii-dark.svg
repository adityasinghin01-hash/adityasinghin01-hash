<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="699.2" y2="690.8">
<stop offset="0" stop-color="#7C3AED"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#10B981"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0; 245 138; 0 0" dur="14s" repeatCount="indefinite"/>
</linearGradient>
<filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="2.2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".5" stop-color="#22D3EE" stop-opacity=".07"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="wipe" gradientUnits="userSpaceOnUse" x1="0" y1="-262.5" x2="153.8" y2="0" spreadMethod="pad" gradientTransform="translate(0,1363.0)">
<stop offset="0" stop-color="#fff"/>
<stop offset=".5" stop-color="#fff"/>
<stop offset="1" stop-color="#000"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0 1363.0" dur="3.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".42 0 .35 1"/>
</linearGradient>
<filter id="wob" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.005 0.009" numOctaves="2" seed="11" result="n">
<animate attributeName="baseFrequency" values="0.005 0.009;0.009 0.006;0.006 0.011;0.005 0.009" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
</feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="72" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="699.2" height="690.8">
<rect x="-280" y="-276" width="1259" height="1243" fill="url(#wipe)" filter="url(#wob)"/>
<rect x="0" y="0" width="699.2" height="690.8" fill="#fff" opacity="1">
<animate attributeName="opacity" values="0;0;1" keyTimes="0;.82;1" dur="4.3s" fill="freeze"/></rect>
</mask>
